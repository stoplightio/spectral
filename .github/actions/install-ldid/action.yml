name: install-ldid
description: 'Install ldid binary'
inputs:
  version:
    description: 'Version of ldid to install'
    required: false
    default: 2.1.5-procursus7
runs:
  using: composite
  steps:
  - name: restore_cache
    uses: actions/cache@v4.3.0
    with:
      # Fully determined by version/os/arch, so an exact hit is the only correct
      # hit -- a prefix fallback could restore a binary built for another arch.
      key: ldid-binary-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
      path: "/tmp/ldid"
  - name: Build ldid
    run: |-
      SUDO="$(command -v sudo || true)"
      ${SUDO} apt-get update -y
      ${SUDO} apt-get -y install libplist-dev
      if [ ! -x ldid/ldid ]
      then
        rm -rf ldid
        curl -L https://github.com/ProcursusTeam/ldid/archive/refs/tags/v${{ inputs.version }}.tar.gz | tar -xz
        mv ldid-${{ inputs.version }} ldid
        make -C ldid
      fi
    working-directory: "/tmp"
    shell: bash
  - name: save_cache
    uses: actions/cache@v4.3.0
    with:
      path: "/tmp/ldid"
      key: ldid-binary-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
  - name: Install ldid
    run: |-
      SUDO="$(command -v sudo || true)"
      ${SUDO} make install
    working-directory: "/tmp/ldid"
    shell: bash