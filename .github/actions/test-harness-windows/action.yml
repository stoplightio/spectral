name: test-harness
description: 'Run tests.'
inputs:
  os:
    description: 'Operating system to run the tests on (linux, windows, macos)'
    required: true
  node-version:
    description: 'Node.js version to run the tests with'
    required: true
runs:
  using: composite
  steps:
  - name: Compute commit SHAs to be used for caching purposes
    id: shas
    run: |-
      $ErrorActionPreference = 'Stop'
      $previous = git rev-parse HEAD~1
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($previous)) {
        throw "Could not resolve HEAD~1 (is the clone shallow?)"
      }
      $current = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($current)) {
        throw "Could not resolve HEAD"
      }
      "previous=$previous" >> $env:GITHUB_OUTPUT
      "current=$current" >> $env:GITHUB_OUTPUT
    shell: pwsh
  - name: restore_cache
    uses: actions/cache@v4.3.0
    with:
      key: test-harness-${{ inputs.os }}-${{ inputs.node-version }}-${{ steps.shas.outputs.previous }}
      path: |-
        ./.cache/spectral-test-harness
        ./test-harness/tests/
      restore-keys: test-harness-${{ inputs.os }}-${{ inputs.node-version }}-
  - uses: "./.github/actions/build-binary"
    with:
      targets: "${{ inputs.os }}"
      node-version: "${{ inputs.node-version }}"
      bytecode: 'false'
  - name: Run harness tests Windows
    if: ${{ inputs.os == 'windows' }}
    run: yarn test.harness --maxWorkers=3
    shell: pwsh
  - name: save_cache
    uses: actions/cache@v4.3.0
    with:
      path: |-
        ./.cache/spectral-test-harness
        ./test-harness/tests/
      key: test-harness-${{ inputs.os }}-${{ inputs.node-version }}-${{ steps.shas.outputs.current }}