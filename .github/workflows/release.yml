name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run release in dry-run mode (no publishing)'
        required: false
        default: false
        type: boolean

jobs:
  # Call the commit workflow to run all tests and linting
  run-tests:
    uses: ./.github/workflows/commit.yml

  release:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    needs:
    - run-tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}
    - name: Configure Git
      run: |
        git config --global --add safe.directory /__w/spectral/spectral
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Set up NPM auth
      run: |
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        echo "✓ .npmrc file created"
        ls -la ~/.npmrc
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Verify NPM authentication
      run: |
        echo "Verifying NPM token..."
        if npm whoami; then
          echo "✓ NPM authentication successful"
        else
          echo "✗ NPM authentication failed - token may be invalid or expired"
          echo "Please check:"
          echo "  1. NPM_TOKEN secret is set in repository settings"
          echo "  2. Token has not been revoked on npmjs.com"
          echo "  3. If using 2FA, it's set to 'Authorization only' (not 'Authorization and writes')"
          exit 1
        fi
    - name: Build
      run: yarn build
    - name: Release (dry-run mode hardcoded for testing)
      run: yarn release
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
