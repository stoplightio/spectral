name: Commit
on:
  pull_request:
    branches: [develop]
    paths-ignore:
    - README.md
    - .github/**
jobs:
  test-node:
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
      options: --user root
    strategy:
      matrix:
        node-version:
        - '20.19.6' # maintance LTS
        - '22.21.1' # maintenance LTS
        - '24.11.1' # active LTS
        - '25.2.1' # current
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Build
      run: yarn build
      shell: bash
    - name: Test node
      run: yarn pretest
      shell: bash
    - name: Run node tests
      run: yarn test.jest --ci --maxWorkers=3
      shell: bash
    - name: Test harness
      uses: "./.github/actions/test-harness"
      with:
        os: linux
        node-version: "${{ matrix.node-version }}"
  test-windows:
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
      with:
        install-corepack: true
    - name: Build
      run: yarn build
      shell: powershell
    - name: Test node
      run: yarn pretest
      shell: powershell
    - name: Run node tests
      run: yarn test.jest --ci --maxWorkers=3
      shell: powershell

    - name: Test harness
      uses: "./.github/actions/test-harness"
      with:
        os: windows
        node-version: "${{ matrix.node-version }}"
  test-browser:
    runs-on: ubuntu-latest
    container:
      image: node:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Build
      run: yarn build
      shell: bash
    - run: yarn pretest
    - name: Run browser tests
      run: yarn test.karma
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
      with:
        install-corepack: true
    - name: Build
      run: yarn build
      shell: bash
    - name: Lint commit message
      run: node ./scripts/lint-commit-messages.mjs
    - name: Lint code
      run: |-
        yarn prelint
        yarn lint.eslint
    - name: Lint documentation
      run: yarn lint.prettier
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    container:
      image: node:lts
    needs:
    - lint
    - test-node
    - test-windows
    - test-browser
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Prepare release
      uses: "./.github/actions/prepare-release"
    - name: Checkout code
      uses: actions/checkout@v5.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Set up NPM auth
      run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
    - name: Build
      run: yarn build
    - name: Release
      run: yarn release